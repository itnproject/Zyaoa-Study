<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyaoa-Study</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="katex/katex.min.css">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                <h1 class="logo">Zyaoa-Study</h1>
            </div>
            <div class="top-bar-center">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索...">
                </div>
            </div>
            <div class="top-bar-right">
                <button class="theme-btn" id="themeBtn" title="深色模式">
                    <svg class="icon-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="icon-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="main-wrapper">
            <aside class="sidebar" id="sidebar">
                <nav class="tree-nav" id="treeNav"></nav>
            </aside>

            <main class="main-content" id="mainContent">
                <div class="content-body" id="contentBody">
                    <div class="welcome-page" id="welcomePage">
                        <div class="welcome-top">
                            <h1>Zyaoa-Study</h1>
                            <p class="welcome-slogan">人人都用得起的免费学习站</p>
                        </div>
                        <div class="welcome-meta">
                            <span>数学</span>
                            <span class="meta-sep">|</span>
                            <span>7~9年级</span>
                            <span class="meta-sep">|</span>
                            <span>永久免费 · 无广告 · 开源</span>
                        </div>
                        <div class="subject-cards">
                            <div class="subject-card" data-subject="math">
                                <div class="card-main">
                                    <span class="card-title">数学</span>
                                    <span class="card-range">7~9年级</span>
                                </div>
                                <div class="card-progress">已读 <span class="progress-count" data-subject="math">0</span>/<span class="progress-total" data-subject="math">171</span></div>
                            </div>
                        </div>
                        <div class="welcome-footer">
                            <div class="footer-meta">
                                <span>Github仓库：<a href="https://github.com/itnproject/Zyaoa-Study" target="_blank">https://github.com/itnproject/Zyaoa-Study</a></span>
                            </div>
                            <div class="footer-meta">
                                <span>Zyaoa-Study（Study.zyaoa.com）代码遵循AGPL 3.0协议，文章遵循 CC BY-NC-SA 4.0 协议，禁止商业使用</span>
                            </div>
                            <div class="footer-meta">
                                <span>教材为2024新版，不保证内容与课本一致，由 AI 辅助整理</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="cookie-banner" id="cookieBanner">
        <div class="cookie-banner-title">Cookie 使用说明</div>
        <div class="cookie-banner-text">本网站使用 Cookie 仅用于保存您的已读信息和做题资料，不会收集任何个人隐私数据。</div>
        <div class="cookie-banner-actions">
            <button class="cookie-btn cookie-btn-allow" id="cookieAllow">允许 Cookie</button>
            <button class="cookie-btn cookie-btn-deny" id="cookieDeny">不保存已读信息和做题资料</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="katex/katex.min.js"></script>
    <script src="katex/contrib/auto-render.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
